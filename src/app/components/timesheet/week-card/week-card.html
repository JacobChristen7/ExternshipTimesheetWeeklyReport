<div class="mt-2">
    <div class="bg-white dark:bg-gray-800 pb-6 px-6 pt-2 rounded-lg shadow-md transition-all duration-300">
      <div class="flex justify-between items-start">
        <div class="flex-1">
          <h2 class="mb-2 dark:text-white transition-colors duration-300 text-xl font-semibold">Week {{ weekNumber }}:</h2>
        </div>
        <div class="relative group">
          <button 
            (click)="onDeleteClick()"
            class="text-red-500 hover:text-red-700 dark:text-red-400 dark:hover:text-red-300 transition-all duration-300 bg-transparent border-0 p-2 cursor-pointer mt-2 hover:scale-110"
            aria-label="Delete week">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
          </button>
          <!-- Tooltip -->
          <div class="absolute right-0 mt-1 px-2 py-1 bg-gray-600 dark:bg-gray-700 text-white text-xs rounded shadow-lg whitespace-nowrap z-10
                      opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
            Delete week
          </div>
        </div>
      </div>
      <p class="text-gray-600 dark:text-gray-300 mb-4 transition-colors duration-300">{{ startDate }} - - - {{ endDate }}</p>
      
      <div class="grid grid-cols-4 transition-colors duration-300">
        <!-- Header Row -->
        <div class="bg-gray-200 dark:bg-gray-700 px-4 py-2 font-semibold text-gray-800 dark:text-gray-200 transition-colors duration-300">Day</div>
        <div class="bg-gray-200 dark:bg-gray-700 px-4 py-2 font-semibold text-gray-800 dark:text-gray-200 transition-colors duration-300">Date</div>
        <div class="bg-gray-200 dark:bg-gray-700 px-4 py-2 font-semibold text-gray-800 dark:text-gray-200 transition-colors duration-300">Hours</div>
        <div class="bg-gray-200 dark:bg-gray-700 px-4 py-2 font-semibold text-gray-800 dark:text-gray-200 transition-colors duration-300">Notes</div>
        
        <!-- Days -->
        <ng-container *ngFor="let day of days; let i = index">
          <div class="px-4 py-2 text-gray-800 dark:text-gray-200 transition-colors duration-300">
            {{ day.day }}
          </div>
          <div class="px-4 py-2 text-gray-800 dark:text-gray-200 transition-colors duration-300">
            {{ day.date }}
          </div>
          <div class="px-4 py-2 text-gray-800 dark:text-gray-200 transition-colors duration-300">
            <input 
              type="number" 
              [(ngModel)]="day.hours" 
              (focus)="onHoursFocus($event)"
              (blur)="onHoursBlur(i)"
              min="0" 
              step="0.5" 
              class="w-full bg-transparent text-center focus:outline-none focus:ring-2 focus:ring-blue-300 rounded py-1 dark:text-gray-200 dark:border-white transition-colors duration-300">
          </div>
          <div class="px-4 py-2 text-gray-800 dark:text-gray-200 transition-colors duration-300">
            <input 
              type="text" 
              [(ngModel)]="day.notes" 
              (blur)="onNotesBlur(i)"
              placeholder="Notes..." 
              class="w-full bg-transparent text-center focus:outline-none focus:ring-2 focus:ring-blue-300 rounded py-1 dark:placeholder:text-gray-400 dark:text-gray-200 dark:border-white transition-colors duration-300 placeholder:transition-colors placeholder:duration-300">
          </div>
        </ng-container>
      </div>
      
      <!-- Total Hours -->
      <div class="mt-4 p-4 bg-gray-200 dark:bg-gray-700 rounded-md transition-colors duration-300">
        <div class="flex justify-between items-center">
          <span class="font-semibold text-gray-800 dark:text-gray-200 transition-colors duration-300">Total Weekly Hours:</span>
          <span class="text-xl font-bold text-gray-800 dark:text-gray-200 transition-colors duration-300">{{ weeklyTotal }}</span>
        </div>
      </div>
      
      <div class="mt-2 p-4 bg-blue-100 dark:bg-blue-900 rounded-md transition-colors duration-300">
        <div class="flex justify-between items-center">
          <span class="font-semibold text-blue-800 dark:text-blue-200 transition-colors duration-300">Total Hours (All Weeks):</span>
          <span class="text-xl font-bold text-blue-800 dark:text-blue-200 transition-colors duration-300">{{ totalAllWeeks }}</span>
        </div>
      </div>
    </div>
  </div>
