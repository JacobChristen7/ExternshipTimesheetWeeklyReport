<div class="min-h-[80vh] flex items-center justify-center bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
  <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md w-full max-w-md transition-colors duration-300">
    <h1 class="text-3xl font-bold mb-2 text-center dark:text-white transition-colors duration-300">
      {{ isSignUp ? 'Sign Up' : 'Sign In' }}
    </h1>
    <p class="text-gray-600 dark:text-gray-300 mb-6 text-center transition-colors duration-300">
      MTECH Externship Timesheet
    </p>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 transition-colors duration-300 mb-2">
          Email
        </label>
        <input
          [(ngModel)]="email"
          name="email"
          type="email"
          required
          class="w-full box-border pl-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md
                 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-300"
          placeholder="your@email.com"
        />
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 transition-colors duration-300 mb-2">
          Password
        </label>
        <input
          [(ngModel)]="password"
          name="password"
          type="password"
          required
          class="w-full box-border pl-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md
                 bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100
                 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-300"
          placeholder="••••••••"
        />
      </div>

      <!-- Error Message -->
      <p *ngIf="errorMessage" class="text-red-500 text-sm">
        {{ errorMessage }}
      </p>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-md font-medium cursor-pointer
               transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
        {{ loading ? 'Loading...' : (isSignUp ? 'Sign Up' : 'Sign In') }}
      </button>
    </form>

    <!-- Divider -->
    <div class="mt-4 flex items-center">
      <div class="flex-1 border-t border-gray-300 dark:border-gray-600"></div>
      <span class="px-4 text-sm text-gray-500 dark:text-gray-400 transition-colors duration-300">or</span>
      <div class="flex-1 border-t border-gray-300 dark:border-gray-600"></div>
    </div>

    <!-- Google Sign In -->
    <button
      (click)="signInWithGoogle()"
      type="button"
      [disabled]="loading"
      class="w-full mt-4 flex items-center justify-center gap-2 bg-white dark:bg-gray-700 cursor-pointer
            border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 
            py-2 rounded-md font-medium hover:bg-gray-50 dark:hover:bg-gray-600 
            transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <!-- Toggle Sign In/Sign Up -->
    <div class="mt-4 text-center">
      <button
        (click)="toggleMode()"
        type="button"
        class="text-blue-600 dark:text-blue-400 hover:underline bg-transparent border-none transition-colors duration-300 cursor-pointer">
        {{ isSignUp ? 'Already have an account? Sign In' : "Don't have an account? Sign Up" }}
      </button>
    </div>

    <!-- Forgot Password -->
    <div *ngIf="!isSignUp" class="mt-2 text-center">
      <button
        (click)="onForgotPassword()"
        type="button"
        class="text-sm text-blue-600 dark:text-blue-400 hover:underline bg-transparent border-none transition-colors duration-300 cursor-pointer">
        Forgot password?
      </button>
    </div>

    <!-- Success Message -->
    <p *ngIf="successMessage" class="mt-2 text-green-600 dark:text-green-400 text-sm text-center">
      {{ successMessage }}
    </p>
  </div>
</div>
