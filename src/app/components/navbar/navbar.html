<nav class="bg-gray-800 sticky top-0 z-50 shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      
      <div class="flex items-center gap-4">
        <h1 class="text-white text-2xl font-bold">MTECH</h1>

        <!-- Dark Mode Button -->
        <button 
          (click)="toggleDarkMode()"
          class="text-gray-300 hover:text-white transition-all duration-300 hover:scale-110 bg-transparent border-none outline-none"
          [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
          
          <!-- Sun -->
          @if (isDarkMode()) {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
              <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z" />
            </svg>
          } @else {
            <!-- Moon -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
              <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z" clip-rule="evenodd" />
            </svg>
          }
        </button>
      </div>
      <!-- Nav Links/Routes -->
      <ul class="flex items-center space-x-2 list-none">
        <li>
          <a routerLink="/" 
             class="no-underline text-gray-300 hover:text-white hover:bg-gray-700 px-3 py-2 rounded-md text-sm font-medium transition duration-300">
            Home
          </a>
        </li>
        <li>
          <a routerLink="/timesheet" 
             class="no-underline text-gray-300 hover:text-white hover:bg-gray-700 px-3 py-2 rounded-md text-sm font-medium transition duration-300">
            Timesheet
          </a>
        </li>
        <li>
          <a routerLink="/report" 
             class="no-underline text-gray-300 hover:text-white hover:bg-gray-700 px-3 py-2 rounded-md text-sm font-medium transition duration-300">
            Report
          </a>
        </li>
        
        <!-- User Dropdown -->
        <li class="relative">
          @if (authService.isLoggedIn()) {
            <!-- User Icon Button -->
            <button
              (click)="toggleDropdown()"
              class="flex items-center justify-center w-10 h-10 rounded-full bg-blue-600 hover:bg-blue-500 text-white font-semibold transition duration-300 focus:outline-none focus:ring-0 border-0 cursor-pointer">
              <span class="text-lg">
                {{ (authService.currentUser()?.email || 'U').charAt(0).toUpperCase() }}
              </span>
            </button>

            <!-- Dropdown Menu -->
            @if (isDropdownOpen()) {
              <div class="absolute right-0 mt-2 w-56 bg-white dark:bg-gray-800 border-2 border-solid border-gray-300 dark:border-gray-700 rounded-xl shadow-2xl py-2 px-2 z-50 transition-all duration-300">
                <!-- User Email Header -->
                <div class="px-2 pt-2 border-gray-100 dark:border-gray-700">
                  <p class="text-sm font-semibold text-gray-900 dark:text-gray-100 truncate text-center">
                    {{ authService.currentUser()?.email }}
                  </p>
                </div>

                <hr class="my-4 w-[98%] mx-auto rounded-full border-t-0 border-solid border-gray-300 dark:border-gray-700">

                <!-- Profile Option -->
                <button
                  (click)="navigateToProfile()"
                  class="w-full text-left px-2 py-2 text-sm text-gray-700 dark:text-gray-200 bg-transparent hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md transition-all duration-300 flex items-center gap-3 border border-gray-100 dark:border-gray-700 cursor-pointer">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                    <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695z" clip-rule="evenodd" />
                  </svg>
                  Profile
                </button>

                <!-- Logout Option -->
                <button
                  (click)="logout()"
                  class="w-full text-left px-2 py-2 text-sm text-red-600 dark:text-red-400 bg-transparent hover:bg-gray-100 dark:hover:bg-gray-700 rounded-md transition-all duration-300 flex items-center gap-3 border border-gray-100 dark:border-gray-700 cursor-pointer">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4">
                    <path fill-rule="evenodd" d="M7.5 3.75A1.5 1.5 0 006 5.25v13.5a1.5 1.5 0 001.5 1.5h6a1.5 1.5 0 001.5-1.5V15a.75.75 0 011.5 0v3.75a3 3 0 01-3 3h-6a3 3 0 01-3-3V5.25a3 3 0 013-3h6a3 3 0 013 3V9A.75.75 0 0115 9V5.25a1.5 1.5 0 00-1.5-1.5h-6zm10.72 4.72a.75.75 0 011.06 0l3 3a.75.75 0 010 1.06l-3 3a.75.75 0 11-1.06-1.06l1.72-1.72H9a.75.75 0 010-1.5h10.94l-1.72-1.72a.75.75 0 010-1.06z" clip-rule="evenodd" />
                  </svg>
                  Sign out
                </button>
              </div>
            }

            <!-- Click Outside to Close -->
            @if (isDropdownOpen()) {
              <div 
                (click)="closeDropdown()"
                class="fixed inset-0 z-40">
              </div>
            }
          } @else {
            <!-- Login Button -->
            <a routerLink="/login" 
              class="no-underline text-gray-300 hover:text-white bg-blue-600 hover:bg-blue-500 px-3 py-2 rounded-md text-sm font-medium transition duration-300">
              Login
            </a>
          }
        </li>
      </ul>
      
    </div>
  </div>
</nav>
